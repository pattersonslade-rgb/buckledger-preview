<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<title>Buck Ledger · 3D sim</title>
<style>
:root{--bg:rgba(10,16,24,.72);--fg:#f3f1ea;--mut:#b9c2cc;--acc:#ffb04a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1118;color:var(--fg);font:15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-weight:600;font-size:12px;padding:2px 7px;border-radius:9px;background:rgba(8,12,18,.62);color:#fff;text-shadow:0 1px 2px #000;letter-spacing:.2px}
.lb.stand{border:1px solid rgba(255,176,74,.7)}
.lb.cam{border:1px solid rgba(255,255,255,.55);font-size:11px}
.lb.place{background:rgba(40,28,12,.55);color:#f5e7c8;font-weight:500;font-size:11px}
.lb.oak{background:rgba(20,40,16,.55);color:#dff5c8;font-weight:500;font-size:11px}
.lb.buck{font-size:14px;padding:3px 9px;border-width:2px;border-style:solid}
.lb.guess{opacity:.85;border-style:dashed!important;font-weight:500}
.lb.front{background:rgba(30,60,110,.75);font-size:14px;border:1px solid #9cc4ff}
.lb.st{font-size:12px;border-width:2px;border-style:solid;text-align:center;line-height:1.2}
.lb.st b{display:block;font-size:13px}
.lb.st i{display:block;font-style:normal;font-weight:500;font-size:11px;color:#e8ecef;white-space:normal;max-width:190px}
.lb.st.g{border-color:#3ddc6a}.lb.st.y{border-color:#ffd23f}.lb.st.r{border-color:#ff4b4b}
.lb.walk{font-size:11.5px;border:2px solid;font-weight:600;white-space:normal;max-width:200px;text-align:center}
.chip.best{border-color:#3ddc6a;background:rgba(20,80,40,.8)}.chip.avoid{border-color:#ff4b4b;background:rgba(100,20,20,.8)}
.lb.red{background:rgba(120,10,10,.75);border:1px solid #ff5a5a;font-size:11px}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#dayBtn{pointer-events:auto;align-self:flex-start;max-width:100%;background:var(--bg);color:var(--fg);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 12px;font-size:15px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:left}
#dayBtn small{display:block;font-weight:500;color:var(--mut);font-size:12.5px;margin-top:1px}
#status{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--bg);border-radius:11px;padding:4px 9px;font-size:12.5px;color:#e9edf1;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1)}
.chip.hot{border-color:rgba(255,140,60,.6)}.chip.cold{border-color:rgba(120,180,255,.6)}.chip.front{border-color:#9cc4ff;background:rgba(30,60,110,.75)}
#side{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 120px);display:flex;flex-direction:column;gap:8px}
.sbtn{background:var(--bg);color:var(--fg);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:600;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 8px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
#bucks{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
#bucks::-webkit-scrollbar{display:none}
.bk{flex:0 0 auto;background:var(--bg);color:#fff;border:2px solid rgba(255,255,255,.2);border-radius:16px;padding:6px 12px;font-weight:700;font-size:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.bk.on{background:rgba(255,255,255,.16)}
.bk.dim{opacity:.45}
#timebar{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:18px;padding:6px 10px 6px 6px;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#play{flex:0 0 46px;height:46px;border-radius:23px;border:none;background:var(--acc);color:#1a1205;font-size:20px;font-weight:900}
#arcWrap{flex:1;position:relative;height:74px;touch-action:none}
#arc{width:100%;height:100%;display:block}
#tod{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
#speed{flex:0 0 auto;background:transparent;color:var(--mut);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:6px 8px;font-size:12px;font-weight:600}
#caption{position:fixed;left:6%;right:6%;bottom:calc(env(safe-area-inset-bottom) + 200px);text-align:center;font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 8px #000,0 0 2px #000;opacity:0;transition:opacity .8s;pointer-events:none;line-height:1.25}
#caption.on{opacity:1}
.sheet{position:fixed;left:8px;right:8px;bottom:8px;max-height:72vh;overflow:auto;background:rgba(12,18,26,.96);border-radius:18px;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);border:1px solid rgba(255,255,255,.15);display:none;z-index:5}
.sheet.on{display:block}
.sheet h3{margin:2px 0 8px;font-size:16px}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:10px 12px;margin:6px 0;font-size:15px;font-weight:700}
.opt small{display:block;color:var(--mut);font-weight:500;font-size:13px}
.key{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.sw{flex:0 0 34px;height:14px;border-radius:7px}
.tog{margin-left:auto;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:3px 9px;font-size:12px}
.note{color:var(--mut);font-size:12.5px;line-height:1.4;margin-top:10px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:#0b1118;z-index:9}
body.rec #side,body.rec #speed{display:none}
body.rec #bucks{display:none}

/* BL: Buck Ledger layers */
#blchips{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto;padding-right:74px}#blexag{padding-right:74px}
.blc{background:var(--bg);color:var(--fg);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:5px 11px;font-size:13px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.blc.on{background:#f3f1ea;color:#10161d}
.lb.st.g{border-color:#00BFA5}.lb.st.y{border-color:#FF8A00}.lb.st.r{border-color:#A0001E}
.chip.best{border-color:#00BFA5;background:rgba(0,90,78,.8)}.chip.avoid{border-color:#A0001E;background:rgba(100,0,20,.8)}
.lb.tip{white-space:normal;max-width:240px;text-align:left;border:2px solid #f3f1ea;padding:6px 9px;font-weight:500;line-height:1.3}
.lb.tip b{display:block;font-size:13px}.lb.tip i{display:block;font-style:normal;font-size:12px;margin:3px 0}.lb.tip small{display:block;color:#b9c2cc;font-size:10.5px}
.tipshare{margin-top:5px;background:#f3f1ea;color:#10161d;border:none;border-radius:9px;padding:4px 10px;font-weight:700;font-size:12px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="top">
  <button id="dayBtn">Loading…</button>
  <div id="status"></div>
</div>
<div id="side">
  <button class="sbtn" id="viewBtn">Views</button>
  <button class="sbtn" id="keyBtn">Key</button>
</div>
<div id="caption"></div>
<div id="bottom">
  <div id="bucks"></div>
  <div id="timebar">
    <button id="play" aria-label="Play">❚❚</button>
    <div id="arcWrap"><svg id="arc" viewBox="0 0 300 74" preserveAspectRatio="none"></svg><div id="tod"></div></div>
    <button id="speed">Slow</button>
  </div>
</div>
<div class="sheet" id="daySheet"><h3>Pick a real day</h3><div id="dayList"></div></div>
<div class="sheet" id="viewSheet"><h3>Views</h3><div id="viewList"></div></div>
<div class="sheet" id="keySheet"><h3>What you're seeing</h3><div id="keyList"></div><div class="note" id="keyNote"></div></div>
<div id="loading">Loading the 3D ground…</div>
<script src="../fieldtips.js"></script>
<script src="port.js"></script>
</body>
</html>
